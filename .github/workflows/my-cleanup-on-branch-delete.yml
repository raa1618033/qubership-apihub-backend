name: my CleanUP on Branch Delete
run-name: CleanUP for ${{ github.event.ref_type }} '${{ github.event.ref }}' deleted

on:
  delete:
    branches: ["**"]
    tags: ["**"]

env:
  BRANCH_NAME: ${{ github.event.ref }}

jobs:
  handle_deletion:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log deletion info
        run: |
          echo "Deleted ${{ github.event.ref_type }}: ${BRANCH_NAME}"
          echo "Deleted by: ${{ github.actor }}"

      - name: Prepare branch tag pattern
        if: github.event.ref_type == 'branch'
        id: prepare_branch_tag
        run: |
          branch_tag=$(echo "${BRANCH_NAME}" | sed 's@refs/tags/@@;s@refs/heads/@@;s@refs/pull/@pull/@;s@^develop$@dev@;s@^release$@next@;s@/@-@g')
          echo  "branch_tag=$branch_tag"
          echo  "branch_tag=$branch_tag" >> "$GITHUB_OUTPUT"

      - name: Determine tags to delete
        id: determine_tags
        run: |
          if [ "${{ github.event.ref_type }}" = "branch" ]; then
            echo "tags_to_delete=timestamp-*-${{ steps.prepare_branch_tag.outputs.branch_tag }}" >> "$GITHUB_OUTPUT"
          fi
          if [ "${{ github.event.ref_type }}" = "tag" ]; then
            echo "tags_to_delete=${BRANCH_NAME#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi
          echo "tags_to_delete=$tags_to_delete"

      - name: Print summary
        run: |
          echo "=== Deletion Summary ==="
          echo "Event: ${{ github.event_name }}"
          echo "Ref Type: ${{ github.event.ref_type }}"
          echo "Deleted Ref: ${BRANCH_NAME}"
          echo "Tags to Delete: ${{ steps.determine_tags.outputs.tags_to_delete }}"
          echo "Actor: ${{ github.actor }}"
          echo "Threshold Days: 0"
          echo "Excluded Tags: main,dev,release"
          echo "Dry Run: false"

      - name: Execute package cleanup
        uses: raa1618033/qubership-workflow-hub/actions/container-package-cleanup@main
        with:
          threshold-days: "0"
          included-tags: "${{ steps.determine_tags.outputs.tags_to_delete }}"
          excluded-tags: "main,dev,release"
          dry-run: "false"
        env:
          PACKAGE_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
