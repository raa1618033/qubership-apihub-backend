name: my CleanUP on Branch Delete
run-name: my CleanUP on Branch Delete for ${{ github.event.ref || 'Deleted Branch' }}
on:
  delete:
    branches:
      - "**"  
env:
  BRANCH_NAME: ${{ github.event.ref }}

jobs:
  HandleBranchDeletion:
    if: github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Info branch deletion
        run: |
          echo "The deleted branch is: ${BRANCH_NAME}"
      
      - name: Prepare Tag
        id: prepare_tag
        run: |
          TAG=$(echo ${BRANCH_NAME} | sed 's@refs/tags/@@;s@refs/heads/@@;s@refs/pull/@pull/@;s@^develop$@dev@;s@^release$@next@;s@/@-@g;')
          echo "TAG=${TAG}"
          echo "TAG=${TAG}" >> $GITHUB_OUTPUT
      
      - name: Prepare Tags To Delete
        id: prepare_tags_delete
        run: |
          TAGS_TO_DELETE="timestamp-*-${{ steps.prepare_tag.outputs.TAG }}"
          [ -n "$INCLUDED_TAGS" ] && TAGS_TO_DELETE="${TAGS_TO_DELETE},${INCLUDED_TAGS}"
          echo "TAGS_TO_DELETE=${TAGS_TO_DELETE}"
          echo "TAGS_TO_DELETE=${TAGS_TO_DELETE}" >> $GITHUB_OUTPUT
      
      - name: Summary
        run: |
          echo "**Event**: ${{ github.event_name }}"
          echo "**Deleted Branch**: ${BRANCH_NAME}"
          echo "**Actor**: ${{ github.actor }}"
          echo "**Threshold days**: 0"
          echo "**Included tags**: none"
          echo "**Excluded tags**: main,dev,release"
          echo "**Dry-run**: false"
      
      - name: Run Container Package Cleanup Action
        uses: raa1618033/qubership-workflow-hub/actions/container-package-cleanup@main
        with:
          threshold-days: "0"
          included-tags: ""
          excluded-tags: "main,dev,release"
          dry-run: "false"
        env:
          PACKAGE_TOKEN: ${{ secrets.GH_ACCESS_TOKEN  }}
