name: my CleanUP on Branch Delete - ${{ github.event.ref }}
on:
  delete:
    branches:
      - "**"  
env:
  BRANCH_NAME: ${{ github.event.ref }}
  PREFIX: "timestamp"
  THRESHOLD_DAYS: "0"           
  INCLUDED_TAGS: ""             
  EXCLUDED_TAGS: ""     
  DRY_RUN: ${{ vars.BRANCH_CLEANUP_DRYRUN || 'true' }}               
  DEBUG: "false"

jobs:
  HandleBranchDeletion:
    if: github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Info branch deletion
        run: |
          echo "The deleted branch is: ${BRANCH_NAME}"
      
      - name: Prepare Tag
        id: prepare_tag
        run: |
          TAG=$(echo ${BRANCH_NAME} | sed 's@refs/tags/@@;s@refs/heads/@@;s@refs/pull/@pull/@;s@^develop$@dev@;s@^release$@next@;s@/@-@g;')
          echo "TAG=${TAG}"
          echo "TAG=${TAG}" >> $GITHUB_OUTPUT
      
      - name: Prepare Tags To Delete
        id: prepare_tags_delete
        run: |
          TAGS_TO_DELETE="${PREFIX}-*-${{ steps.prepare_tag.outputs.TAG }}"
          [ -n "$INCLUDED_TAGS" ] && TAGS_TO_DELETE="${TAGS_TO_DELETE},${INCLUDED_TAGS}"
          echo "TAGS_TO_DELETE=${TAGS_TO_DELETE}"
          echo "TAGS_TO_DELETE=${TAGS_TO_DELETE}" >> $GITHUB_OUTPUT
      
      - name: Summary
        run: |
          echo "**Event**: ${{ github.event_name }}"
          echo "**Deleted Branch**: ${BRANCH_NAME}"
          echo "**Actor**: ${{ github.actor }}"
          echo "**Threshold days**: ${THRESHOLD_DAYS}"
          echo "**Included tags**: ${{ steps.prepare_tags_delete.outputs.TAGS_TO_DELETE }}"
          echo "**Excluded tags**: ${EXCLUDED_TAGS}"
          echo "**Dry-run**: ${DRY_RUN}"
      
      - name: Run Container Package Cleanup Action
        uses: raa1618033/qubership-workflow-hub/actions/container-package-cleanup@main
        with:
          threshold-days: ${{ env.THRESHOLD_DAYS }}
          included-tags: ${{ steps.prepare_tags_delete.outputs.TAGS_TO_DELETE }}
          excluded-tags: ${{ env.EXCLUDED_TAGS }}
          dry-run: ${{ env.DRY_RUN }}
        env:
          PACKAGE_TOKEN: ${{ secrets.GH_ACCESS_TOKEN  }}
