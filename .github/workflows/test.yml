name: my test
on:
  delete:
    branches:
      - "**"  
env:
  REF_NAME: ${{ github.event.ref }}
  PREFIX: "timestamp"
  THRESHOLD_DAYS: "0"           
  INCLUDED_TAGS: ""             
  EXCLUDED_TAGS: ""     
  DRY_RUN: "true"               
  DEBUG: "false"

jobs:
  HandleBranchDeletion:
    if: github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Info branch deletion
        run: |
          echo "The deleted branch is: ${{ github.event.ref }}"
      - name: "Summary"
        run: |
          echo "**Event**: ${{ github.event_name }}"
          echo "**Actor**: ${{ github.actor }}"
          echo "**Threshold days**: ${{ $THRESHOLD_DAYS }}"
          echo "**Included tags**:  ${{ TAGS_TO_DELETE }}"
          echo "**Excluded tags**: ${{ $EXCLUDED_TAGS }}"
          echo "**Dry-run**: ${{ $DRY_RUN }}"
          echo "**Debug**: ${{ $DEBUG }}"
