name: my test
on:
  delete:
    branches:
      - "**"  
env:
  REF_NAME: ${{ github.ref }}
  PREFIX: "timestamp"
  THRESHOLD_DAYS: "0"           
  INCLUDED_TAGS: ""             
  EXCLUDED_TAGS: ""     
  DRY_RUN: "true"               
  DEBUG: "false"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: "Test"
        run: |
          echo "TEST action on branch delete - ${REF_NAME}"
