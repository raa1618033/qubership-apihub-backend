name: Docker images by tag

on:
  workflow_dispatch:
    inputs:
      org:
        description: 'GitLab organization/group (e.g., Netcracker)'
        required: true
        default: 'Netcracker'
      repo:
        description: 'GitLab repository name (e.g., qubership-apihub-backend)'
        required: true
        default: 'qubership-apihub-backend'
      branch:
        description: 'Git branch (optional, leave empty to ignore)'
        required: false
        default: ''
      tag:
        description: 'Docker image tag to search for (e.g., v1.0.0)'
        required: true

jobs:
  get-images:
    runs-on: ubuntu-latest
    steps:
      - name: Validate GitLab Token
        run: |
          if [ -z "${{ secrets.GITLAB_TOKEN }}" ]; then
            echo "::error::GITLAB_TOKEN is not set in GitHub Secrets!"
            exit 1
          fi

      - name: Fetch project details
        env:
          GITLAB_ORG: "${{ inputs.org }}"
          GITLAB_REPO: "${{ inputs.repo }}"
          GITLAB_API_URL: "https://gitlab.com/api/v4"  # Для self-hosted GitLab замените на свой URL
          GITLAB_TOKEN: "${{ secrets.GITLAB_TOKEN }}"
        run: |
          # URL-кодирование пути проекта (для подгрупп)
          PROJECT_PATH="${GITLAB_ORG//\//%2F}%2F${GITLAB_REPO//\//%2F}"
          echo "🔍 Searching in project: $PROJECT_PATH"

          # Проверка доступности проекта и токена
          PROJECT_INFO=$(curl -s -H "PRIVATE-TOKEN: $GITLAB_TOKEN" \
            "$GITLAB_API_URL/projects/$PROJECT_PATH")

          if echo "$PROJECT_INFO" | jq -e '.message == "401 Unauthorized"' > /dev/null; then
            echo "::error::401 Unauthorized. Invalid GITLAB_TOKEN or insufficient permissions!"
            exit 1
          elif echo "$PROJECT_INFO" | jq -e '.id' > /dev/null; then
            PROJECT_ID=$(echo "$PROJECT_INFO" | jq -r '.id')
            echo "✅ Project found. ID: $PROJECT_ID"
            echo "PROJECT_ID=$PROJECT_ID" >> $GITHUB_ENV
          else
            echo "::error::Project not found. Check org/repo or token scope."
            echo "API Response: $PROJECT_INFO"
            exit 1
          fi

      - name: Fetch Docker images by tag
        env:
          GITLAB_BRANCH: "${{ inputs.branch }}"
          GITLAB_TAG: "${{ inputs.tag }}"
          GITLAB_TOKEN: "${{ secrets.GITLAB_TOKEN }}"
        run: |
          echo "🔎 Searching for tag: $GITLAB_TAG (branch: ${GITLAB_BRANCH:-any})"
          
          # Получаем список репозиториев в Registry
          REPOSITORIES=$(curl -s -H "PRIVATE-TOKEN: $GITLAB_TOKEN" \
            "$GITLAB_API_URL/projects/$PROJECT_ID/registry/repositories")

          if [ "$(echo "$REPOSITORIES" | jq length)" -eq 0 ]; then
            echo "No Docker repositories found in the project."
            exit 0
          fi

          # Ищем образы с указанным тегом (и веткой, если задана)
          MATCHED_IMAGES=""
          for REPO_ID in $(echo "$REPOSITORIES" | jq -r '.[].id'); do
            TAGS=$(curl -s -H "PRIVATE-TOKEN: $GITLAB_TOKEN" \
              "$GITLAB_API_URL/projects/$PROJECT_ID/registry/repositories/$REPO_ID/tags")

            FILTERED_TAGS=$(echo "$TAGS" | jq -r \
              --arg TAG "$GITLAB_TAG" \
              --arg BRANCH "$GITLAB_BRANCH" \
              '.[] | select(.name == $TAG) | select(if ($BRANCH != "") then (.release.description // "" | contains($BRANCH)) else true end) | .location')

            if [ -n "$FILTERED_TAGS" ]; then
              MATCHED_IMAGES+="$FILTERED_TAGS"$'\n'
            fi
          done

          if [ -z "$MATCHED_IMAGES" ]; then
            echo "❌ No images found with tag '$GITLAB_TAG'${GITLAB_BRANCH:+ and branch '$GITLAB_BRANCH'}."
          else
            echo "🎉 Matched images:"
            echo "$MATCHED_IMAGES"
            echo "IMAGES_LIST<<EOF" >> $GITHUB_ENV
            echo "$MATCHED_IMAGES" >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          fi
