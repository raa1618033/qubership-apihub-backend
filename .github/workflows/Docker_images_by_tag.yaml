name: Docker images by tag

on:
  workflow_dispatch:
    inputs:
      org:
        description: 'GitLab organization/group (e.g., Netcracker)'
        required: true
        default: 'Netcracker'
      repo:
        description: 'GitLab repository name (e.g., qubership-apihub-backend)'
        required: true
        default: 'qubership-apihub-backend'
      branch:
        description: 'Git branch (optional)'
        required: false
        default: ''
      tag:
        description: 'Docker image tag (e.g., v1.0.0)'
        required: true

jobs:
  get-images:
    runs-on: ubuntu-latest
    steps:
      - name: Check if GitLab Token is provided for private repos
        id: check_token
        run: |
          if [ -z "${{ secrets.GITLAB_TOKEN }}" ]; then
            echo "⚠️ GITLAB_TOKEN not set. Proceeding for public repos only."
            echo "token_provided=false" >> $GITHUB_OUTPUT
          else
            echo "✅ GITLAB_TOKEN is set (can access private repos)"
            echo "token_provided=true" >> $GITHUB_OUTPUT
          fi

      - name: Fetch project info
        env:
          GITLAB_ORG: "${{ inputs.org }}"
          GITLAB_REPO: "${{ inputs.repo }}"
          GITLAB_API_URL: "https://gitlab.com/api/v4"  # Для self-hosted укажите свой URL
        run: |
          # URL-кодирование пути (для подгрупп)
          PROJECT_PATH="${GITLAB_ORG//\//%2F}%2F${GITLAB_REPO//\//%2F}"
          echo "🔍 Project path: $PROJECT_PATH"

          # Заголовок авторизации (если токен есть)
          AUTH_HEADER=""
          if ${{ steps.check_token.outputs.token_provided == 'true' }}; then
            AUTH_HEADER="PRIVATE-TOKEN: ${{ secrets.GITLAB_TOKEN }}"
          fi

          # Проверка доступности проекта
          RESPONSE=$(curl -s -H "$AUTH_HEADER" "$GITLAB_API_URL/projects/$PROJECT_PATH")

          if echo "$RESPONSE" | jq -e '.id' > /dev/null; then
            echo "✅ Project found. ID: $(echo "$RESPONSE" | jq -r '.id')"
            echo "PROJECT_ID=$(echo "$RESPONSE" | jq -r '.id')" >> $GITHUB_ENV
          else
            echo "::error::Project not found or access denied. Response:"
            echo "$RESPONSE"
            exit 1
          fi

      - name: Fetch Docker images by tag
        env:
          GITLAB_BRANCH: "${{ inputs.branch }}"
          GITLAB_TAG: "${{ inputs.tag }}"
        run: |
          echo "🔎 Searching for tag: $GITLAB_TAG (branch: ${GITLAB_BRANCH:-any})"

          # Заголовок авторизации (если токен есть)
          AUTH_HEADER=""
          if ${{ steps.check_token.outputs.token_provided == 'true' }}; then
            AUTH_HEADER="PRIVATE-TOKEN: ${{ secrets.GITLAB_TOKEN }}"
          fi

          # Получаем список репозиториев в Registry
          REPOSITORIES=$(curl -s -H "$AUTH_HEADER" "$GITLAB_API_URL/projects/$PROJECT_ID/registry/repositories")

          if [ "$(echo "$REPOSITORIES" | jq length)" -eq 0 ]; then
            echo "No Docker repositories found in the project."
            exit 0
          fi

          # Ищем образы с указанным тегом (и веткой, если задана)
          MATCHED_IMAGES=""
          for REPO_ID in $(echo "$REPOSITORIES" | jq -r '.[].id'); do
            TAGS=$(curl -s -H "$AUTH_HEADER" "$GITLAB_API_URL/projects/$PROJECT_ID/registry/repositories/$REPO_ID/tags")

            FILTERED_TAGS=$(echo "$TAGS" | jq -r \
              --arg TAG "$GITLAB_TAG" \
              --arg BRANCH "$GITLAB_BRANCH" \
              '.[] | select(.name == $TAG) | select(if ($BRANCH != "") then (.release.description // "" | contains($BRANCH)) else true end) | .location')

            if [ -n "$FILTERED_TAGS" ]; then
              MATCHED_IMAGES+="$FILTERED_TAGS"$'\n'
            fi
          done

          if [ -z "$MATCHED_IMAGES" ]; then
            echo "❌ No images found with tag '$GITLAB_TAG'${GITLAB_BRANCH:+ and branch '$GITLAB_BRANCH'}."
          else
            echo "🎉 Matched images:"
            echo "$MATCHED_IMAGES"
            echo "IMAGES_LIST<<EOF" >> $GITHUB_ENV
            echo "$MATCHED_IMAGES" >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          fi
