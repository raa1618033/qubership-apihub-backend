name: Docker images by tag

on:
  workflow_dispatch:
    inputs:
      owner:
        description: 'GitHub owner/organization (e.g., Netcracker)'
        required: true
        default: 'Netcracker'
      repo:
        description: 'GitHub repository name (e.g., qubership-apihub-backend)'
        required: true
        default: 'qubership-apihub-backend'
      branch:
        description: 'Git branch (optional filter)'
        required: false
        default: ''
      tag:
        description: 'Docker image tag (e.g., v1.0.0)'
        required: true

jobs:
  get-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch images by tag
        env:
          OWNER: "${{ inputs.owner }}"
          REPO: "${{ inputs.repo }}"
          TAG: "${{ inputs.tag }}"
          BRANCH: "${{ inputs.branch }}"
        run: |
          # Формируем URL для запроса тегов
          URL="https://ghcr.io/v2/$OWNER/$REPO/tags/list"

          # Получаем список всех тегов
          TAGS_RESPONSE=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" "$URL")
          echo "Available tags: $(echo "$TAGS_RESPONSE" | jq -r '.tags[]')"

          # Фильтруем по нужному тегу
          FILTERED_TAGS=$(echo "$TAGS_RESPONSE" | jq -r --arg TAG "$TAG" '.tags[] | select(. == $TAG)')

          if [ -z "$FILTERED_TAGS" ]; then
            echo "❌ No images found with tag: $TAG"
            exit 0
          fi

          # Формируем список образов
          IMAGES=""
          for T in $FILTERED_TAGS; do
            IMAGES+="ghcr.io/$OWNER/$REPO:$T"$'\n'
          done

          echo "🎉 Found images:"
          echo "$IMAGES"
          echo "IMAGES_LIST<<EOF" >> $GITHUB_ENV
          echo "$IMAGES" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
