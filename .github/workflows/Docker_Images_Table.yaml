name: Docker Images Table Generator

on:
  workflow_dispatch:
    inputs:
      ghcr_org:
        description: 'GitHub Organization/User name'
        required: false
        default: 'Netcracker'
        type: string
      repo_name:
        description: 'Repository name in GHCR'
        required: false
        default: 'qubership-apihub-backend'
        type: string
      show_digest:
        description: 'Show image digests?'
        required: false
        default: 'true'
        type: boolean

jobs:
  report-ghcr-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install PyGithub requests

    - name: Generate GHCR images report
      env:
        GHCR_ORG: ${{ inputs.ghcr_org || 'Netcracker' }}
        REPO_NAME: ${{ inputs.repo_name || 'qubership-apihub-backend' }}
        SHOW_DIGEST: ${{ inputs.show_digest || 'true' }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        python - <<"EOF"
        import os
        import requests
        from datetime import datetime
        from urllib.parse import quote

        org = os.getenv('GHCR_ORG')
        repo_name = os.getenv('REPO_NAME')
        show_digest = os.getenv('SHOW_DIGEST', 'true').lower() == 'true'
        gh_token = os.getenv('GITHUB_TOKEN')
        output_file = 'GHCR_IMAGES_REPORT.md'
        api_url = "https://api.github.com"

        def safe_get(data, *keys, default=""):
            for key in keys:
                try:
                    data = data[key]
                except (KeyError, TypeError):
                    return default
            return data

        def escape_md(text):
            return str(text).replace("|", "\|").replace("`", "\`").replace("*", "\*")

        headers = {
            "Authorization": f"Bearer {gh_token}",
            "Accept": "application/vnd.github.v3+json",
            "X-GitHub-Api-Version": "2022-11-28"
        }

        image_data = []
        package_name = quote(repo_name.lower())
        url = f"{api_url}/orgs/{org}/packages/container/{package_name}/versions"
        
        try:
            print(f"Fetching package versions from: {url}")
            response = requests.get(url, headers=headers)
            response.raise_for_status()
            versions = response.json()

            for version in versions:
                try:
                    tags = safe_get(version, "metadata", "container", "tags", default=[])
                    if not tags:
                        continue
                        
                    created_at = safe_get(version, "created_at", default="N/A")
                    digest = safe_get(version, "name", default="")[:12]
                    size_bytes = safe_get(version, "size_in_bytes", default=0)
                    size_mb = round(size_bytes / (1024**2), 2) if size_bytes else 0
                    
                    for tag in tags:
                        image_data.append({
                            'tag': tag,
                            'image': f"ghcr.io/{org}/{repo_name}:{tag}",
                            'created': created_at,
                            'digest': digest,
                            'size': f"{size_mb} MB"
                        })
                        
                except Exception as e:
                    print(f"Error processing version: {e}")
                    continue

        except requests.exceptions.RequestException as e:
            print(f"API request failed: {e}")
            exit(1)

        try:
            with open(output_file, 'w', encoding='utf-8') as f:
                f.write("# GHCR Docker Images Report\n\n")
                f.write(f"Organization: {org}\n")
                f.write(f"Repository: {repo_name}\n")
                f.write(f"Generated at: {datetime.utcnow().strftime('%Y-%m-%d %H:%M:%S UTC')}\n\n")
                
                if image_data:
                    columns = ["Tag", "Image", "Created", "Size"]
                    if show_digest:
                        columns.insert(3, "Digest")
                    
                    f.write("| " + " | ".join(columns) + " |\n")
                    f.write("|" + "|".join(["-" * (len(col)+2) for col in columns]) + "|\n")
                    
                    for item in sorted(image_data, key=lambda x: x.get('created', ''), reverse=True):
                        row = [
                            escape_md(item.get('tag', 'N/A')),
                            f"`{escape_md(item.get('image', 'N/A'))}`",
                            escape_md(item.get('created', 'N/A')),
                            escape_md(item.get('size', 'N/A'))
                        ]
                        if show_digest:
                            row.insert(3, f"`{escape_md(item.get('digest', 'N/A'))}`")
                        f.write("| " + " | ".join(row) + " |\n")
                else:
                    f.write("No container images found in GHCR.\n")
                    
            print(f"Successfully generated report: {output_file}")
            
        except Exception as e:
            print(f"Error writing report: {e}")
            exit(1)

        try:
            with open(output_file, 'r') as f:
                print("\nReport content preview:")
                print(f.read(1000) + ("..." if len(f.read()) > 1000 else ""))
        except:
            print("Could not read report file")
        EOF

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ghcr-images-report
        path: GHCR_IMAGES_REPORT.md
