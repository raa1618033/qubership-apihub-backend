name: Docker Images Table Generator

on:
  workflow_dispatch:

jobs:
  generate-table:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PyGithub requests

    - name: Generate Docker images table
      env:
        SOURCE_REPO: "Netcracker/qubership-apihub-backend" 
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        python - <<EOF
        import os
        from github import Github
        from datetime import datetime

       
        source_repo = os.getenv('SOURCE_REPO')
        gh_token = os.getenv('GITHUB_TOKEN')
        output_file = 'DOCKER_IMAGES_TABLE.md'

        
        def init_github():
            if gh_token:
                g = Github(gh_token)
                print("Using authenticated GitHub client")
            else:
                g = Github()
                print("Using anonymous GitHub client")
            return g

        g = init_github()
        
       
        def check_rate_limit():
            rate_limit = g.get_rate_limit()
            remaining = rate_limit.core.remaining
            reset_time = rate_limit.core.reset
            print(f"API calls remaining: {remaining}")
            print(f"Limit resets at: {reset_time}")
            return remaining

        remaining_calls = check_rate_limit()

        
        try:
            repo = g.get_repo(source_repo)
            branches = repo.get_branches()
            print(f"Found {branches.totalCount} branches in {source_repo}")
        except Exception as e:
            print(f"Error accessing repository: {e}")
            exit(1)

        
        image_data = []
        for branch in branches:
            branch_name = branch.name
            print(f"\nProcessing branch: {branch_name}")
            
            try:
                
                try:
                    dockerfile = repo.get_contents("Dockerfile", ref=branch_name)
                    print(f"Found Dockerfile in {branch_name}")
                except Exception as e:
                    print(f"Dockerfile not found in {branch_name}: {e}")
                    continue
                
                
                image_name = f"ghcr.io/{source_repo}:{branch_name}"
                last_updated = branch.commit.commit.last_modified
                
                image_data.append({
                    'branch': branch_name,
                    'image_name': image_name,
                    'last_updated': last_updated
                })
                
                print(f"Added image: {image_name} (updated: {last_updated})")
                
               
                if len(image_data) % 10 == 0:
                    remaining_calls = check_rate_limit()
                    if remaining_calls < 50:
                        print("Warning: Low API calls remaining!")
                        
            except Exception as e:
                print(f"Error processing branch {branch_name}: {e}")
                continue

        
        try:
            with open(output_file, 'w', encoding='utf-8') as f:
                f.write("# Docker Images Table\n\n")
                f.write("| Branch | Image Name | Last Updated |\n")
                f.write("|--------|------------|--------------|\n")
                for item in image_data:
                    branch = item.get('branch', 'N/A')
                    image = item.get('image_name', 'N/A')
                    updated = item.get('last_updated', 'N/A')
                    
                    safe_image = str(image).replace('`', '\`').replace('|', '\|')
                    f.write(f"| {branch} | `{safe_image}` | {updated} |\n")
                    
            print(f"\nSuccessfully generated table in {output_file}")
            print("Final table contents:")
            print("="*50)
            with open(output_file, 'r') as f:
                print(f.read())
            print("="*50)
            
        except Exception as e:
            print(f"Error generating table: {e}")
            exit(1)

       
        check_rate_limit()
        EOF
        echo "Generated table:"
        cat DOCKER_IMAGES_TABLE.md

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: docker-images
        path: |
          DOCKER_IMAGES_TABLE.md
        
