name: Docker Images Table Generator

on:
  workflow_dispatch:

jobs:
  generate-table:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PyGithub requests

    - name: Generate GHCR images report
      env:
        GHCR_ORG: "Netcracker"
        REPO_NAME: "qubership-apihub-backend"
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        python - <<"EOF"
        import os
        import requests
        from datetime import datetime
        from github import Github
        from urllib.parse import quote

        org = os.getenv('GHCR_ORG')
        repo_name = os.getenv('REPO_NAME')
        gh_token = os.getenv('GITHUB_TOKEN')
        output_file = 'GHCR_IMAGES_REPORT.md'
        api_url = "https://api.github.com"

        def escape_md(text):
            return str(text).replace("|", "\|").replace("`", "\`").replace("*", "\*")

        headers = {
            "Authorization": f"token {gh_token}",
            "Accept": "application/vnd.github.v3+json"
        }

        image_data = []
        try:
            package_name = quote(repo_name.lower())
            url = f"{api_url}/orgs/{org}/packages/container/{package_name}"
            
            response = requests.get(url, headers=headers)
            response.raise_for_status()
            
            versions_url = f"{url}/versions"
            versions_response = requests.get(versions_url, headers=headers)
            versions_response.raise_for_status()
            
            for version in versions_response.json():
                tags = version.get('metadata', {}).get('container', {}).get('tags', [])
                if tags:
                    for tag in tags:
                        image_data.append({
                            'tag': tag,
                            'image': f"ghcr.io/{org}/{repo_name}:{tag}",
                            'created': version['created_at'],
                            'digest': version['name'][:12],
                            'size': f"{round(version['size_bytes'] / (1024**2), 2)} MB"
                        })
        except requests.HTTPError as e:
            if e.response.status_code == 404:
                print(f"Package {repo_name} not found in GHCR")
            else:
                print(f"API Error: {e}")

        with open(output_file, 'w', encoding='utf-8') as f:
            f.write("# GHCR Docker Images Report\n\n")
            f.write(f"Repository: ghcr.io/{org}/{repo_name}\n")
            f.write(f"Generated at: {datetime.utcnow().strftime('%Y-%m-%d %H:%M:%S UTC')}\n\n")
            
            if image_data:
                f.write("| Tag | Image | Created | Digest | Size |\n")
                f.write("|-----|-------|---------|--------|------|\n")
                
                for item in sorted(image_data, key=lambda x: x['created'], reverse=True):
                    f.write(f"| {escape_md(item['tag'])} | `{escape_md(item['image'])}` | ")
                    f.write(f"{escape_md(item['created'])} | `{escape_md(item['digest'])}` | ")
                    f.write(f"{escape_md(item['size'])} |\n")
            else:
                f.write("No container images found in GHCR.\n")

        print(f"Report generated: {output_file}")
        EOF
        echo "Generated table:"
        cat DOCKER_IMAGES_TABLE.md

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: docker-images
        path: |
          DOCKER_IMAGES_TABLE.md
        
