name: Docker Images Table Generator

on:
  workflow_dispatch:

jobs:
  generate-table:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PyGithub requests

    - name: Generate GHCR images report
      env:
        GHCR_REPO: "Netcracker/qubership-apihub-backend" 
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        python - <<"EOF"
        import os
        import requests
        import json
        from datetime import datetime
        from github import Github
        from urllib.parse import quote

        
        repo_name = os.getenv('GHCR_REPO')
        gh_token = os.getenv('GITHUB_TOKEN')
        output_file = 'GHCR_IMAGES_REPORT.md'
        api_url = "https://api.github.com"

        
        def escape_md(text):
            return str(text).replace("|", "\|").replace("`", "\`").replace("*", "\*")

        
        gh = Github(gh_token)
        repo = gh.get_repo(repo_name)
        branches = [b.name for b in repo.get_branches()]

        
        headers = {
            "Authorization": f"Bearer {gh_token}",
            "Accept": "application/vnd.github.v3+json"
        }
        
        image_data = []
        for branch in branches:
            image_name = f"{repo_name.split('/')[-1]}:{branch}"
            encoded_name = quote(f"ghcr.io/{repo_name.split('/')[0]}/{image_name}", safe='')
            
            try:
                url = f"{api_url}/users/packages/container/{encoded_name}/versions"
                response = requests.get(url, headers=headers)
                response.raise_for_status()
                
                versions = response.json()
                for version in versions:
                    if version['metadata']['container']['tags']:
                        image_data.append({
                            'branch': branch,
                            'image': f"ghcr.io/{repo_name}:{branch}",
                            'created': version['created_at'],
                            'digest': version['name'][:12],
                            'size': f"{round(version['size_bytes'] / (1024**2), 2)} MB"
                        })
            except Exception as e:
                print(f"Error processing {image_name}: {e}")

        with open(output_file, 'w', encoding='utf-8') as f:
            f.write("# GHCR Docker Images Report\n\n")
            f.write(f"Generated at: {datetime.utcnow().strftime('%Y-%m-%d %H:%M:%S UTC')}\n\n")
            f.write("| Branch | Image | Created | Digest | Size |\n")
            f.write("|--------|-------|---------|--------|------|\n")
            
            for item in sorted(image_data, key=lambda x: x['created'], reverse=True):
                f.write(f"| {escape_md(item['branch'])} | `{escape_md(item['image'])}` | ")
                f.write(f"{escape_md(item['created'])} | `{escape_md(item['digest'])}` | ")
                f.write(f"{escape_md(item['size'])} |\n")

        print(f"Report generated: {output_file}")
        EOF
        echo "Generated table:"
        cat DOCKER_IMAGES_TABLE.md

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: docker-images
        path: |
          DOCKER_IMAGES_TABLE.md
        
